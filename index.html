<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Video Optimizer Pro</title>
    <!-- Loads the local service worker to enable SharedArrayBuffer on GitHub Pages -->
    <script src="coi-serviceworker.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass max-w-md w-full rounded-2xl p-6 shadow-2xl">
        <div class="flex items-center space-x-3 mb-2">
            <div class="w-3 h-8 bg-emerald-500 rounded-full"></div>
            <h1 class="text-2xl font-bold text-white tracking-wide">WA Video Optimizer</h1>
        </div>
        <p class="text-xs text-slate-400 mb-6">WhatsApp Compression එකෙන් Quality බහින්නේ නැතුව Video යවන්න හදපු Tool එකක්.</p>

        <div class="mb-5">
            <label class="block text-sm font-medium text-slate-300 mb-2">1. Video එක තෝරන්න</label>
            <input type="file" id="uploader" accept="video/*" class="block w-full text-sm text-slate-400
                file:mr-4 file:py-2.5 file:px-4
                file:rounded-xl file:border-0
                file:text-sm file:font-semibold
                file:bg-emerald-500/10 file:text-emerald-400
                hover:file:bg-emerald-500/20 cursor-pointer border border-slate-700 rounded-xl p-1.5" />
        </div>

        <div class="mb-5">
            <label class="block text-sm font-medium text-slate-300 mb-2">2. Mode එක තෝරන්න</label>
            <div class="grid grid-cols-2 gap-3">
                <label class="cursor-pointer">
                    <input type="radio" name="mode" value="status" class="peer sr-only" checked>
                    <div class="p-3 rounded-xl border border-slate-700 peer-checked:border-emerald-500 peer-checked:bg-emerald-500/10 transition text-center">
                        <div class="font-bold text-sm text-white">Status Mode</div>
                        <div class="text-[11px] text-slate-400 mt-0.5">720p • 30fps • 2.2 Mbps</div>
                    </div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="mode" value="chat" class="peer sr-only">
                    <div class="p-3 rounded-xl border border-slate-700 peer-checked:border-emerald-500 peer-checked:bg-emerald-500/10 transition text-center">
                        <div class="font-bold text-sm text-white">Chat HD Mode</div>
                        <div class="text-[11px] text-slate-400 mt-0.5">1080p • 30fps • 4.5 Mbps</div>
                    </div>
                </label>
            </div>
        </div>

        <div class="mb-6 flex items-center justify-between bg-slate-800/60 p-3.5 rounded-xl border border-slate-700/60">
            <div>
                <div class="text-sm font-medium text-slate-200">Auto Sharpen & Contrast</div>
                <div class="text-[11px] text-slate-400">WhatsApp එකෙන් වෙන බොඳවීම නැති කරයි</div>
            </div>
            <input type="checkbox" id="sharpen" checked class="w-5 h-5 accent-emerald-500 rounded cursor-pointer">
        </div>

        <button id="convertBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-4 rounded-xl transition duration-200 shadow-lg shadow-emerald-900/30 disabled:opacity-50 disabled:cursor-not-allowed">
            Optimize Video
        </button>

        <div id="statusBox" class="mt-5 hidden bg-slate-900/50 p-4 rounded-xl border border-slate-800">
            <div class="flex justify-between text-xs text-slate-300 mb-2">
                <span id="statusText">Engine එක Load වෙමින් පවතී...</span>
                <span id="progressPercent" class="font-mono text-emerald-400">0%</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
                <div id="progressBar" class="bg-emerald-500 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            <p class="text-[11px] text-slate-500 mt-2 text-center">Browser එක Close කරන්න එපා.</p>
        </div>

        <div id="resultBox" class="mt-6 hidden border-t border-slate-700/80 pt-5">
            <div class="flex items-center justify-between mb-3">
                <span class="text-sm font-semibold text-emerald-400">✓ සාර්ථකව Optimize වුණා!</span>
                <span id="fileSizeBadge" class="text-xs bg-slate-800 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700"></span>
            </div>
            <video id="outputVideo" controls class="w-full rounded-xl mb-4 max-h-60 bg-black border border-slate-800"></video>
            <a id="downloadBtn" class="block w-full text-center bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl transition shadow-lg shadow-blue-900/30">
                Download Optimized Video
            </a>
        </div>
    </div>

    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        const ffmpeg = createFFmpeg({ 
            log: true,
            corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
        });

        const uploader = document.getElementById('uploader');
        const convertBtn = document.getElementById('convertBtn');
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const resultBox = document.getElementById('resultBox');
        const outputVideo = document.getElementById('outputVideo');
        const downloadBtn = document.getElementById('downloadBtn');
        const fileSizeBadge = document.getElementById('fileSizeBadge');

        let selectedFile = null;

        uploader.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            resultBox.classList.add('hidden');
        });

        ffmpeg.setProgress(({ ratio }) => {
            if (ratio >= 0 && ratio <= 1) {
                const percent = Math.round(ratio * 100);
                progressBar.style.width = `${percent}%`;
                progressPercent.innerText = `${percent}%`;
                statusText.innerText = `Video එක Convert වෙමින් පවතී...`;
            }
        });

        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) {
                alert('කරුණාකර මුලින්ම Video එකක් තෝරන්න!');
                return;
            }

            if (typeof SharedArrayBuffer === 'undefined') {
                window.location.reload();
                return;
            }

            convertBtn.disabled = true;
            statusBox.classList.remove('hidden');
            resultBox.classList.add('hidden');
            progressBar.style.width = '0%';
            progressPercent.innerText = '0%';

            try {
                if (!ffmpeg.isLoaded()) {
                    statusText.innerText = 'FFmpeg Engine එක Load වෙමින් (25MB)...';
                    await ffmpeg.load();
                }

                statusText.innerText = 'Video එක සූදානම් කරමින්...';
                const inputName = 'input.mp4';
                const outputName = 'output.mp4';

                ffmpeg.FS('writeFile', inputName, await fetchFile(selectedFile));

                const mode = document.querySelector('input[name="mode"]:checked').value;
                const useSharpen = document.getElementById('sharpen').checked;

                const resolution = mode === 'status' ? '720' : '1080';
                const bitrate = mode === 'status' ? '2200k' : '4500k';
                const maxrate = mode === 'status' ? '2500k' : '5000k';
                const bufsize = mode === 'status' ? '4400k' : '9000k';

                let vf = `scale='if(gt(iw,ih),-2,${resolution})':'if(gt(iw,ih),${resolution},-2)',fps=30`;
                if (useSharpen) {
                    vf += `,unsharp=5:5:0.8:5:5:0.0,eq=contrast=1.04`;
                }
                vf += `,format=yuv420p`;

                await ffmpeg.run(
                    '-i', inputName,
                    '-vf', vf,
                    '-c:v', 'libx264',
                    '-profile:v', 'high',
                    '-level:v', '4.0',
                    '-preset', 'ultrafast',
                    '-b:v', bitrate,
                    '-maxrate', maxrate,
                    '-bufsize', bufsize,
                    '-c:a', 'aac',
                    '-b:a', '128k',
                    '-ar', '44100',
                    '-movflags', '+faststart',
                    '-y',
                    outputName
                );

                statusText.innerText = 'අවසන් කරමින්...';
                const data = ffmpeg.FS('readFile', outputName);

                const videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
                const videoUrl = URL.createObjectURL(videoBlob);
                
                const sizeMB = (videoBlob.size / (1024 * 1024)).toFixed(2);
                fileSizeBadge.innerText = `${sizeMB} MB`;

                outputVideo.src = videoUrl;
                downloadBtn.href = videoUrl;
                downloadBtn.download = `WA_${mode.toUpperCase()}_${Date.now()}.mp4`;

                statusBox.classList.add('hidden');
                resultBox.classList.remove('hidden');

                ffmpeg.FS('unlink', inputName);
                ffmpeg.FS('unlink', outputName);

            } catch (error) {
                console.error(error);
                alert('Error: ' + error.message);
                statusBox.classList.add('hidden');
            } finally {
                convertBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
