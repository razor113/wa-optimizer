<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WA Video Optimizer Studio</title>
    <script src="coi-serviceworker.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    <style>
        body { background-color: #090d16; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); }
        .option-card { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(51, 65, 85, 0.6); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6">

    <div class="glass max-w-lg w-full rounded-2xl p-5 sm:p-6 shadow-2xl">
        <!-- Header -->
        <div class="flex items-center justify-between mb-2">
            <div class="flex items-center space-x-3">
                <div class="w-2.5 h-7 bg-emerald-500 rounded-full"></div>
                <h1 class="text-xl sm:text-2xl font-bold text-white tracking-wide">WA Studio Optimizer</h1>
            </div>
            <span class="text-[10px] font-bold uppercase tracking-wider bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-500/20">Pro v2.0</span>
        </div>
        <p class="text-xs text-slate-400 mb-5">WhatsApp Quality නොබැස Video Optimize, Split සහ Edit කරන All-in-One ටූල් එක.</p>

        <!-- 1. File Upload -->
        <div class="mb-4">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">1. ප්‍රධාන Video එක තෝරන්න</label>
            <input type="file" id="uploader" accept="video/*" class="block w-full text-sm text-slate-300
                file:mr-3 file:py-2 file:px-4
                file:rounded-xl file:border-0
                file:text-xs file:font-semibold
                file:bg-emerald-500/15 file:text-emerald-400
                hover:file:bg-emerald-500/25 cursor-pointer border border-slate-700/80 rounded-xl p-1.5 bg-slate-900/50" />
        </div>

        <!-- 2. Target Mode -->
        <div class="mb-4">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">2. Quality Mode එක</label>
            <div class="grid grid-cols-2 gap-2.5">
                <label class="cursor-pointer">
                    <input type="radio" name="mode" value="status" class="peer sr-only" checked>
                    <div class="p-3 rounded-xl border border-slate-700/80 bg-slate-900/40 peer-checked:border-emerald-500 peer-checked:bg-emerald-500/10 transition text-center">
                        <div class="font-bold text-sm text-white">Status Mode</div>
                        <div class="text-[11px] text-slate-400 mt-0.5">720p • 30fps • 2.2 Mbps</div>
                    </div>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" name="mode" value="chat" class="peer sr-only">
                    <div class="p-3 rounded-xl border border-slate-700/80 bg-slate-900/40 peer-checked:border-emerald-500 peer-checked:bg-emerald-500/10 transition text-center">
                        <div class="font-bold text-sm text-white">Chat HD Mode</div>
                        <div class="text-[11px] text-slate-400 mt-0.5">1080p • 30fps • 4.5 Mbps</div>
                    </div>
                </label>
            </div>
        </div>

        <!-- 3. Studio Features Grid -->
        <div class="mb-4">
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">3. Studio Effects & Tools</label>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mb-2.5">
                <!-- Auto Sharpen -->
                <label class="option-card p-3 rounded-xl flex items-center justify-between cursor-pointer">
                    <div>
                        <div class="text-xs font-semibold text-slate-200">Auto Sharpen</div>
                        <div class="text-[10px] text-slate-400">බොඳවීම නැති කරයි</div>
                    </div>
                    <input type="checkbox" id="sharpen" checked class="w-4 h-4 accent-emerald-500 rounded">
                </label>

                <!-- 30s Status Splitter -->
                <label class="option-card p-3 rounded-xl flex items-center justify-between cursor-pointer">
                    <div>
                        <div class="text-xs font-semibold text-emerald-300">30s Status Split</div>
                        <div class="text-[10px] text-slate-400">තත්පර 30න් 30ට කපයි</div>
                    </div>
                    <input type="checkbox" id="split30" class="w-4 h-4 accent-emerald-500 rounded">
                </label>

                <!-- 9:16 Blur Background -->
                <label class="option-card p-3 rounded-xl flex items-center justify-between cursor-pointer sm:col-span-2">
                    <div>
                        <div class="text-xs font-semibold text-slate-200">9:16 Blur Background Fit (Status සඳහා)</div>
                        <div class="text-[10px] text-slate-400">Landscape වීඩියෝවල කළු තීරු වෙනුවට Blur පසුබිමක් දමයි</div>
                    </div>
                    <input type="checkbox" id="blurBg" class="w-4 h-4 accent-emerald-500 rounded">
                </label>
            </div>

            <!-- Audio & Speed Controls -->
            <div class="grid grid-cols-2 gap-2.5 mb-2.5">
                <div class="option-card p-2.5 rounded-xl">
                    <label class="block text-[10px] text-slate-400 mb-1">Audio Control</label>
                    <select id="audioMode" class="w-full bg-slate-900 text-xs text-white rounded-lg p-1.5 border border-slate-700 outline-none">
                        <option value="normal">Normal Audio</option>
                        <option value="boost">Volume Boost (1.5x)</option>
                        <option value="mute">Mute Audio (සද්දේ එපා)</option>
                    </select>
                </div>
                <div class="option-card p-2.5 rounded-xl">
                    <label class="block text-[10px] text-slate-400 mb-1">Video Speed</label>
                    <select id="speedMode" class="w-full bg-slate-900 text-xs text-white rounded-lg p-1.5 border border-slate-700 outline-none">
                        <option value="1">Normal (1.0x)</option>
                        <option value="1.25">Fast (1.25x)</option>
                        <option value="0.75">Slow-Mo (0.75x)</option>
                    </select>
                </div>
            </div>

            <!-- Watermark / Logo Upload -->
            <div class="option-card p-3 rounded
